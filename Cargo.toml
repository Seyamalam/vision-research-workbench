[package]
name = "vision-research-workbench"
version = "0.1.0"
edition = "2024"
description = "Native Rust GPUI workbench for image AI research workflows"
license = "MIT"
repository = "https://github.com/Seyamalam/vision-research-workbench"

[dependencies]
gpui = "0.2.2"
csv = "1.4.0"
image = "0.25.10"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
